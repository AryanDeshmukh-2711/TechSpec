<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="TechSpec — compare phones, laptops, tablets, watches, headphones and cameras against the specs that actually matter to you."
    />
    <title>TechSpec — Comparison, weighted your way</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237C5CFF'/%3E%3Cpath d='M8 21V11M14 21V7M20 21V14M26 21V9' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        var stored = localStorage.getItem('techspec:theme')
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
        var theme = stored || (prefersLight ? 'light' : 'dark')
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.classList.toggle('light', theme === 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
